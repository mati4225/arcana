<svg width="600" height="415" viewBox="0 0 600 415" xmlns="http://www.w3.org/2000/svg">
  <title>Árbol de búsqueda de Branch and Bound en el tablero de 4x4</title>
  <style>
    text { font-family: 'Courier New', Courier, monospace; }
    .frame        { fill: #f5f7fa; stroke: #9baec8; stroke-width: 1.5; }
    .ghost        { fill: #f5f7fa; fill-opacity: 0.5; stroke: #777777; stroke-width: 1.5; stroke-dasharray: 4,3; }
    .val-sm       { font-size: 15px; font-weight: 700; fill: #1a1a2e; text-anchor: middle; }
    .ghost-val    { font-size: 15px; font-weight: 700; fill: #555555; text-anchor: middle; }
    .idx          { font-size: 12px; fill: #777777; text-anchor: middle; }
    .link         { stroke: #9baec8; stroke-width: 1.8; fill: none; }
    .op           { font-size: 12px; font-weight: 700; fill: #777777; text-anchor: middle; }
    .accent-label { font-size: 13px; font-weight: 700; fill: #c0742a; text-anchor: middle; }
    .accent-arrow { stroke: #c0742a; stroke-width: 1.8; fill: none; }
    .query        { fill: #f5f7fa; stroke: #c0742a; stroke-width: 1.8; }
    .query-best   { stroke-width: 3; }
    .badge        { fill: #9baec8; }
    .badge-accent { fill: #c0742a; }
    .badge-num    { font-size: 11px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
    @media (prefers-color-scheme: dark) {
      .frame        { fill: #1e2330; stroke: #4a6fa5; }
      .ghost        { fill: #1e2330; stroke: #8899aa; }
      .val-sm       { fill: #e2e8f0; }
      .ghost-val    { fill: #aab4c0; }
      .idx          { fill: #8899aa; }
      .link         { stroke: #4a6fa5; }
      .op           { fill: #8899aa; }
      .accent-label { fill: #d4884a; }
      .accent-arrow { stroke: #d4884a; }
      .query        { fill: #1e2330; stroke: #d4884a; }
      .badge        { fill: #4a6fa5; }
      .badge-accent { fill: #d4884a; }
      .badge-num    { fill: #1a1a2e; }
    }
  </style>

  <line x1="300" y1="63" x2="300" y2="97" class="accent-arrow"/>
  <line x1="300" y1="143" x2="190" y2="177" class="accent-arrow"/>
  <line x1="190" y1="223" x2="190" y2="257" class="accent-arrow"/>
  <line x1="300" y1="143" x2="410" y2="177" class="link"/>
  <rect x="250" y="17" width="100" height="46" rx="6" class="frame"/>
  <text x="300" y="38" class="val-sm">(4,2)</text>
  <text x="300" y="55" class="idx">g=0 f=1</text>
  <circle cx="250" cy="17" r="10" class="badge"/>
  <text x="250" y="21" class="badge-num">1</text>
  <rect x="250" y="97" width="100" height="46" rx="6" class="frame"/>
  <text x="300" y="118" class="val-sm">(3,1)</text>
  <text x="300" y="135" class="idx">g=1 f=3</text>
  <circle cx="250" cy="97" r="10" class="badge"/>
  <text x="250" y="101" class="badge-num">2</text>
  <rect x="140" y="177" width="100" height="46" rx="6" class="frame"/>
  <text x="190" y="198" class="val-sm">(1,3)</text>
  <text x="190" y="215" class="idx">g=2 f=3</text>
  <circle cx="140" cy="177" r="10" class="badge"/>
  <text x="140" y="181" class="badge-num">3</text>
  <rect x="140" y="257" width="100" height="46" rx="6" class="query query-best"/>
  <text x="190" y="278" class="val-sm">(2,4)</text>
  <text x="190" y="295" class="idx">g=3 f=3</text>
  <circle cx="140" cy="257" r="10" class="badge-accent"/>
  <text x="140" y="261" class="badge-num">4</text>
  <rect x="360" y="177" width="100" height="46" rx="6" class="ghost"/>
  <text x="410" y="198" class="ghost-val">(2,2)</text>
  <text x="410" y="215" class="idx">g=2 f=4</text>
  <circle cx="360" cy="177" r="10" class="badge"/>
  <text x="360" y="181" class="badge-num">5</text>
  <line x1="368" y1="215" x2="452" y2="185" class="accent-arrow"/>
  <text x="410" y="245" class="accent-label">podado por cota</text>
  <text x="410" y="262" class="op">4 ≥ mejor (3)</text>
  <text x="410" y="278" class="op">no se expande</text>
  <text x="190" y="325" class="accent-label">DESTINO</text>
  <text x="190" y="341" class="accent-label">mejor = 3 (óptimo)</text>
  <text x="300" y="374" class="op">el número de cada nodo es el orden en que sale del heap (1 a 5)</text>
  <text x="300" y="394" class="op">g = movimientos hechos, f = g + h (cota)</text>
</svg>
