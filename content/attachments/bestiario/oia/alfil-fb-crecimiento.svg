<svg width="600" height="410" viewBox="0 0 600 410" xmlns="http://www.w3.org/2000/svg">
  <title>Crecimiento de las llamadas de la fuerza bruta según el tamaño del tablero</title>
  <style>
    text { font-family: 'Courier New', Courier, monospace; }
    .cell         { fill: #f5f7fa; stroke: #9baec8; stroke-width: 1.5; }
    .divider      { stroke: #9baec8; stroke-width: 1; stroke-dasharray: 3,4; }
    .axis         { stroke: #9baec8; stroke-width: 1.5; }
    .val-sm       { font-size: 15px; font-weight: 700; fill: #1a1a2e; text-anchor: middle; }
    .idx          { font-size: 12px; fill: #777777; text-anchor: end; }
    .op           { font-size: 13px; font-weight: 700; fill: #777777; text-anchor: middle; }
    .ghost        { fill: #f5f7fa; fill-opacity: 0.5; stroke: #777777; stroke-width: 1.5; stroke-dasharray: 4,3; }
    .accent-label { font-size: 13px; font-weight: 700; fill: #c0742a; text-anchor: middle; }
    .accent-arrow { stroke: #c0742a; stroke-width: 1.8; fill: none; }
    .accent-arrow-fill { fill: #c0742a; }
    @media (prefers-color-scheme: dark) {
      .cell         { fill: #1e2330; stroke: #4a6fa5; }
      .divider      { stroke: #4a6fa5; }
      .axis         { stroke: #4a6fa5; }
      .val-sm       { fill: #e2e8f0; }
      .idx          { fill: #8899aa; }
      .op           { fill: #8899aa; }
      .ghost        { fill: #1e2330; stroke: #8899aa; }
      .accent-label { fill: #d4884a; }
      .accent-arrow { stroke: #d4884a; }
      .accent-arrow-fill { fill: #d4884a; }
    }
  </style>

  <text x="82" y="354" class="idx">1</text>
  <line x1="90" y1="296" x2="560" y2="296" class="divider"/>
  <text x="82" y="300" class="idx">100</text>
  <line x1="90" y1="242" x2="560" y2="242" class="divider"/>
  <text x="82" y="246" class="idx">10⁴</text>
  <line x1="90" y1="188" x2="560" y2="188" class="divider"/>
  <text x="82" y="192" class="idx">10⁶</text>
  <line x1="90" y1="134" x2="560" y2="134" class="divider"/>
  <text x="82" y="138" class="idx">10⁸</text>
  <line x1="90" y1="80" x2="560" y2="80" class="divider"/>
  <text x="82" y="84" class="idx">10¹⁰</text>
  <line x1="90" y1="350" x2="560" y2="350" class="axis"/>
  <line x1="90" y1="350" x2="90" y2="70" class="axis"/>
  <text x="20" y="210.0" class="op" transform="rotate(-90 20 210.0)">llamadas (escala log)</text>
  <rect x="109.0" y="325.6" width="56" height="24.4" class="cell"/>
  <rect x="127.4" y="299.6" width="19.2" height="22" rx="4" class="cell"/>
  <text x="137" y="315.6" class="val-sm">8</text>
  <text x="137" y="372" class="op">3×3</text>
  <rect x="203.0" y="294.9" width="56" height="55.1" class="cell"/>
  <rect x="212.2" y="268.9" width="37.6" height="22" rx="4" class="cell"/>
  <text x="231" y="284.9" class="val-sm">110</text>
  <text x="231" y="372" class="op">4×4</text>
  <rect x="297.0" y="230.2" width="56" height="119.8" class="cell"/>
  <rect x="292.4" y="204.2" width="65.2" height="22" rx="4" class="cell"/>
  <text x="325" y="220.2" class="val-sm">27.408</text>
  <text x="325" y="372" class="op">5×5</text>
  <rect x="391.0" y="149.2" width="56" height="200.8" class="cell"/>
  <rect x="368.0" y="123.2" width="102.0" height="22" rx="4" class="cell"/>
  <text x="419" y="139.2" class="val-sm">27.341.862</text>
  <text x="419" y="372" class="op">6×6</text>
  <rect x="485.0" y="81.7" width="56" height="268.3" class="ghost"/>
  <line x1="513" y1="107.7" x2="513" y2="59.7" class="accent-arrow"/>
  <polygon points="507,61.7 519,61.7 513,51.7" class="accent-arrow-fill"/>
  <text x="509" y="29.7" class="accent-label">más de 8.600 millones</text>
  <text x="509" y="45.7" class="accent-label">y no terminó</text>
  <text x="513" y="372" class="op">7×7</text>
  <text x="325" y="398" class="op">tablero vacío, de esquina a esquina</text>
</svg>
