<svg width="720" height="430" viewBox="0 0 720 430" xmlns="http://www.w3.org/2000/svg">
  <title>Tablero de 4x4 con el recorrido óptimo del alfil</title>
  <style>
    text { font-family: 'Courier New', Courier, monospace; }
    .cell         { fill: #f5f7fa; stroke: #9baec8; stroke-width: 1.5; }
    .ghost        { fill: #f5f7fa; fill-opacity: 0.5; stroke: #777777; stroke-width: 1.5; stroke-dasharray: 4,3; }
    .query        { fill: #f5f7fa; stroke: #c0742a; stroke-width: 2.5; }
    .cell-null    { fill: #fff4e6; stroke: #c0742a; stroke-width: 1.5; stroke-dasharray: 5,3; }
    .val          { font-size: 20px; font-weight: 700; fill: #1a1a2e; text-anchor: middle; }
    .char-null    { font-size: 20px; font-weight: 700; fill: #a0522d; text-anchor: middle; }
    .idx          { font-size: 12px; fill: #777777; text-anchor: middle; }
    .op           { font-size: 13px; font-weight: 700; fill: #777777; text-anchor: middle; }
    .leg          { font-size: 14px; font-weight: 700; fill: #1a1a2e; }
    .op-arrow     { stroke: #777777; stroke-width: 1.5; fill: none; stroke-dasharray: 4,3; }
    .accent-label { font-size: 18px; font-weight: 700; fill: #c0742a; text-anchor: middle; }
    .accent-arrow { stroke: #c0742a; stroke-width: 2.2; fill: none; stroke-linecap: round; }
    .accent-arrow-fill { fill: #c0742a; }
    .badge-accent { fill: #c0742a; }
    .badge-num    { font-size: 11px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
    @media (prefers-color-scheme: dark) {
      .cell         { fill: #1e2330; stroke: #4a6fa5; }
      .ghost        { fill: #1e2330; stroke: #8899aa; }
      .query        { fill: #1e2330; stroke: #d4884a; }
      .cell-null    { fill: #2a1f10; stroke: #d4884a; }
      .val, .leg    { fill: #e2e8f0; }
      .char-null    { fill: #d4884a; }
      .idx, .op     { fill: #8899aa; }
      .op-arrow     { stroke: #8899aa; }
      .accent-label { fill: #d4884a; }
      .accent-arrow { stroke: #d4884a; }
      .accent-arrow-fill, .badge-accent { fill: #d4884a; }
      .badge-num    { fill: #1a1a2e; }
    }
  </style>

  <text x="220" y="14" class="op">columna</text>
  <text x="16" y="200" class="op" transform="rotate(-90 16 200)">fila</text>
  <text x="100.0" y="32" class="idx">1</text>
  <text x="44" y="84.0" class="idx">1</text>
  <text x="180.0" y="32" class="idx">2</text>
  <text x="44" y="164.0" class="idx">2</text>
  <text x="260.0" y="32" class="idx">3</text>
  <text x="44" y="244.0" class="idx">3</text>
  <text x="340.0" y="32" class="idx">4</text>
  <text x="44" y="324.0" class="idx">4</text>
  <rect x="140" y="40" width="80" height="80" class="ghost"/>
  <rect x="300" y="40" width="80" height="80" class="ghost"/>
  <rect x="60" y="120" width="80" height="80" class="ghost"/>
  <rect x="220" y="120" width="80" height="80" class="ghost"/>
  <rect x="140" y="200" width="80" height="80" class="ghost"/>
  <rect x="300" y="200" width="80" height="80" class="ghost"/>
  <rect x="60" y="280" width="80" height="80" class="ghost"/>
  <rect x="220" y="280" width="80" height="80" class="ghost"/>
  <rect x="60" y="40" width="80" height="80" class="cell"/>
  <rect x="220" y="40" width="80" height="80" class="cell"/>
  <rect x="140" y="120" width="80" height="80" class="cell"/>
  <rect x="60" y="200" width="80" height="80" class="cell"/>
  <rect x="300" y="280" width="80" height="80" class="cell"/>
  <rect x="140" y="280" width="80" height="80" class="query"/>
  <text x="180.0" y="327.0" class="val">A</text>
  <rect x="300" y="120" width="80" height="80" class="query"/>
  <text x="340.0" y="167.0" class="val">O</text>
  <rect x="220" y="200" width="80" height="80" class="cell-null"/>
  <text x="260.0" y="247.0" class="char-null">X</text>
  <line x1="196.0" y1="304.0" x2="242.0" y2="258.0" class="op-arrow"/>
  <line x1="164.4" y1="304.4" x2="124.7" y2="264.7" class="accent-arrow"/>
  <polygon points="117.0,257.0 129.0,260.5 120.5,269.0" class="accent-arrow-fill"/>
  <circle cx="154.5" cy="274.7" r="10" class="badge-accent"/>
  <text x="154.5" y="278.7" class="badge-num">1</text>
  <line x1="115.6" y1="224.4" x2="235.3" y2="104.7" class="accent-arrow"/>
  <polygon points="243.0,97.0 239.5,109.0 231.0,100.5" class="accent-arrow-fill"/>
  <circle cx="185.3" cy="174.5" r="10" class="badge-accent"/>
  <text x="185.3" y="178.5" class="badge-num">2</text>
  <line x1="275.6" y1="95.6" x2="315.3" y2="135.3" class="accent-arrow"/>
  <polygon points="323.0,143.0 311.0,139.5 319.5,131.0" class="accent-arrow-fill"/>
  <circle cx="305.3" cy="105.5" r="10" class="badge-accent"/>
  <text x="305.3" y="109.5" class="badge-num">3</text>
  <rect x="430" y="52" width="28" height="28" class="query"/>
  <text x="444" y="72" class="val" style="font-size: 15px">A</text>
  <text x="472" y="71" class="leg">Inicio (4,2)</text>
  <rect x="430" y="92" width="28" height="28" class="query"/>
  <text x="444" y="112" class="val" style="font-size: 15px">O</text>
  <text x="472" y="111" class="leg">Destino (2,4)</text>
  <rect x="430" y="132" width="28" height="28" class="cell-null"/>
  <text x="444" y="152" class="char-null" style="font-size: 15px">X</text>
  <text x="472" y="151" class="leg">Obstáculo (3,3)</text>
  <rect x="430" y="172" width="28" height="28" class="ghost"/>
  <text x="472" y="191" class="leg">Otro color: descartadas</text>
  <line x1="430" y1="226" x2="446" y2="226" class="accent-arrow"/>
  <polygon points="458,226 446,220 446,232" class="accent-arrow-fill"/>
  <text x="472" y="231" class="leg">Recorrido óptimo (1, 2, 3)</text>
  <line x1="430" y1="262" x2="458" y2="262" class="op-arrow"/>
  <text x="472" y="267" class="leg">Diagonal directa bloqueada</text>
  <text x="550" y="330" class="accent-label">SI, 3 movimientos</text>
  <text x="220" y="398" class="op">(fila + columna) par = color del alfil</text>
</svg>
